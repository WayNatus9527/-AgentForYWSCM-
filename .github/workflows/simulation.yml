name: Simulation regression
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  regression:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt -r requirements-pg-test.txt
      - name: SQLite and isolated worker regression
        run: python scripts/verify_m2.py --mode pytest --test-path tests --root "$PWD/.local/ci/tests"
      - name: Nine fixed scenarios
        run: python scripts/verify_m2.py --mode regression --root "$PWD/.local/ci/fixed"
      - name: Ten independent M4 datasets
        run: python scripts/verify_m4.py --count 10 --root "$PWD/.local/ci/m4"
      - name: Ten independent M5 datasets
        run: python scripts/verify_m5.py --count 10 --root "$PWD/.local/ci/m5"
      - name: Ten independent M6 paired scenario groups
        run: python scripts/verify_m6.py --count 20 --seed-start 2600000000 --root "$PWD/.local/ci/m6"
      - name: PostgreSQL regression and independent M4 M5 M6 datasets
        run: python scripts/verify_m2.py --mode postgres-suite --test-path tests --count 0 --m4-count 10 --m5-count 10 --m6-count 20 --m6-seed-start 2700000000 --root "$PWD/.local/ci/postgresql"
      - name: Retain reports including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-reports
          include-hidden-files: true
          path: |
            .local/ci/**/reports/*.json
            .local/ci/**/archives/**/report.json
            .local/ci/**/archives/fixed-regression-summary.json
